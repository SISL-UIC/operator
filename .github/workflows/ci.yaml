name: ci
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull-request.number || github.ref
    }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  changes:
    name: categorize changes
    runs-on: self-hosted
    outputs:
      non-docs: ${{ steps.detect.outputs.non-docs }}
      yaml: ${{ steps.detect.outputs.yaml }}
    steps:
    - name: Get base depth
      id: base-depth
      run: echo "base-depth=$(expr ${{ github.event.pull_request.commits }} + 1)"
        >> $GITHUB_OUTPUT
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: ${{ steps.base-depth.outputs.base-depth }}
        persist-credentials: false
    - name: detect
      id: detect
      run: |
        git fetch origin ${GITHUB_BASE_REF}

        # Store git diff command for reuse
        GIT_DIFF_CMD="git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

        # Disable pipefail to avoid SIGPIPE (exit 141) when commands like head/grep exit early
        # SIGPIPE occurs when git diff tries to write but the reading end of the pipe has closed
        set +o pipefail

        # Show changed files for debugging (limit to first 50 for readability)
        echo "Changed files (first 50):"
        $GIT_DIFF_CMD | head -50
        FILE_COUNT=$($GIT_DIFF_CMD | wc -l)
        echo "Total files changed: $FILE_COUNT"

        # If no files are changed at all, skip detection
        # Use git diff output directly to avoid bash variable size limits with large PRs
        if [[ $FILE_COUNT -gt 0 ]]; then
          # We only care about grep's exit status (did it find matches?), not the pipe status
          NON_DOCS=$($GIT_DIFF_CMD | grep -Ev '\.md$' > /dev/null && echo 'true' || echo 'false')
          YAML=$($GIT_DIFF_CMD | grep -E '\.ya?ml$' > /dev/null && echo 'true' || echo 'false')
          echo "non-docs=${NON_DOCS}" | tee -a $GITHUB_OUTPUT
          echo "yaml=${YAML}" | tee -a $GITHUB_OUTPUT
        fi

        # Re-enable pipefail for subsequent commands
        set -o pipefail
    timeout-minutes: 6
  build:
    name: build
    needs:
    - changes
    runs-on: self-hosted
    if: ${{ !cancelled() && (needs.changes.outputs.non-docs == 'true') }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
    - name: build
      run: |
        go build -v ./...
    timeout-minutes: 6
  linting:
    needs:
    - changes
    name: lint
    runs-on: self-hosted
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
    - name: gofmt
      if: ${{ needs.changes.outputs.non-docs == 'true' }}
      run: |
        gofmt_out=$(gofmt -d $(find * -name '*.go' ! -path 'vendor/*' ! -path 'third_party/*'))
        if [[ -n "$gofmt_out" ]]; then
            failed=1
        fi
        echo "$gofmt_out"
    - name: golangci-lint
      if: ${{ needs.changes.outputs.non-docs == 'true' }}
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
      with:
        version: v2.12.2
        args: --new-from-merge-base=origin/${{ github.base_ref }} --timeout=10m
    - name: yamllint
      if: ${{ needs.changes.outputs.yaml == 'true' }}
      run: |
        apt update && apt install -y yamllint
        yamllint -c .yamllint $(find . -path ./vendor -prune -o -type f -regex ".*y[a]ml" -print | tr '\n' ' ')
    - name: check-license
      if: ${{ needs.changes.outputs.non-docs == 'true' }}
      run: |
        go install github.com/google/go-licenses@v1.0.0
        go-licenses check ./...
    timeout-minutes: 6
    if: ${{ !cancelled() }}
  tests:
    needs:
    - build
    name: test
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
    - name: build
      run: |
        make test-unit-verbose-and-race
    timeout-minutes: 6
    if: ${{ !cancelled() }}
  generated:
    needs:
    - build
    name: Check generated code
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
    - name: generated
      run: |
        ./hack/verify-codegen.sh
    timeout-minutes: 6
    if: ${{ !cancelled() }}
  multi-arch-build:
    needs:
    - build
    name: Multi-arch build
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
    - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445
    - name: ko-resolve
      run: |
        cat <<EOF > .ko.yaml
        defaultBaseImage: cgr.dev/chainguard/static
        baseImageOverrides:
          github.com/tektoncd/operator/cmd/openshift/operator: registry.access.redhat.com/ubi9/ubi-minimal
          github.com/tektoncd/operator/cmd/openshift/webhook: registry.access.redhat.com/ubi9/ubi-minimal
          github.com/tektoncd/operator/cmd/openshift/proxy-webhook: registry.access.redhat.com/ubi9/ubi-minimal
        EOF

        # Use ko from setup-ko action to avoid Go version mismatch
        KO_BIN=$(which ko) KO_DOCKER_REPO=example.com make TARGET=kubernetes resolve
        KO_BIN=$(which ko) KO_DOCKER_REPO=example.com make TARGET=openshift resolve
    timeout-minutes: 6
    if: ${{ !cancelled() }}
  ci-summary:
    name: CI summary
    needs:
    - build
    - linting
    - tests
    - generated
    - multi-arch-build
    runs-on: self-hosted
    if: ${{ !cancelled() && (always()) }}
    steps:
    - name: Check CI results
      run: |
        results=(
          "build=${NEEDS_BUILD_RESULT}"
          "linting=${NEEDS_LINTING_RESULT}"
          "tests=${NEEDS_TESTS_RESULT}"
          "generated=${NEEDS_GENERATED_RESULT}"
          "multi-arch-build=${NEEDS_MULTI_ARCH_BUILD_RESULT}"
          "e2e-tests=${NEEDS_E2E_TESTS_RESULT}"
        )
        failed=0
        for r in "${results[@]}"; do
          name="${r%%=*}"
          result="${r#*=}"
          echo "${name}: ${result}"
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            failed=1
          fi
        done
        if [ "$failed" -eq 1 ]; then
          echo ""
          echo "Some CI jobs failed or were cancelled"
          exit 1
        fi
      env:
        NEEDS_BUILD_RESULT: ${{ needs.build.result }}
        NEEDS_LINTING_RESULT: ${{ needs.linting.result }}
        NEEDS_TESTS_RESULT: ${{ needs.tests.result }}
        NEEDS_GENERATED_RESULT: ${{ needs.generated.result }}
        NEEDS_MULTI_ARCH_BUILD_RESULT: ${{ needs.multi-arch-build.result }}
        NEEDS_E2E_TESTS_RESULT: ${{ needs.e2e-tests.result }}
    timeout-minutes: 6
env:
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
'on':
  push:
    branches:
    - main
  pull_request: null
